<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMACC IT - Draw Sandbox (P2)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ensures the canvas drawing surface is solid white */
    #canvas {
      background-color: #FFFFFF !important;
      border-radius: 4px;
    }
  </style>
</head>
<body class="sandbox-page">

  <div class="sandbox-container">

    <!-- Drawing Sandbox Card -->
    <div class="sandbox-grid" style="justify-content: center;">
      <div class="draw-card">
        
        <div class="draw-header">
          <b style="color: #ffffff;">Draw anything you want!</b>
        </div>
        <hr class="draw-divider">

        <!-- Instruction & Keyboard Legend Box -->
        <div style="background-color: #f1f5f9; padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; color: #1e293b; width: 100%; border: 1px solid #cbd5e1; line-height: 1.5; margin-bottom: 12px;">
          🎨 <strong>Keyboard Controls Legend:</strong><br>
          • <strong>Colors:</strong> Press <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">0</kbd> (Black), <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">1</kbd> (Red), <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">2</kbd> (Orange), <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">3</kbd> (Yellow), <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">4</kbd> (Green), <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">5</kbd> (Blue), or <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">6</kbd> (Violet).<br>
          • <strong>Line Thickness:</strong> Press <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">&lt;</kbd> (Thin - 3px) or <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">&gt;</kbd> (Thick - 15px).
        </div>
        
        <!-- Canvas Container -->
        <div id="drawb" class="drawbox">
          <canvas id="canvas"></canvas>
        </div>

        <!-- Clear Button Controls -->
        <div class="draw-controls">
          <input type="button" id="clear" value="Clear Canvas" class="clear-btn">
        </div>

      </div>
    </div>

    <!-- Footer Logo Linking Back to Hub -->
    <div class="sandbox-footer">
      <a href="index.html">
        <img class="brand-logo" src="dlogo.png" alt="DMACC Bears Logo">
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="draw.js"></script>
</body>
</html>
