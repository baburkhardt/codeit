<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMACC IT - Draw Sandbox (P2)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ensures the canvas drawing surface is solid white and scales cleanly */
    #canvas {
      background-color: #FFFFFF !important;
      border-radius: 4px;
      width: 100%;
      max-width: 500px;
      height: auto;
      aspect-ratio: 1 / 1;
    }
    /* Layout container for side-by-side canvas & legend */
    .draw-workspace {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .legend-box {
      background-color: #f1f5f9;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      line-height: 1.6;
      max-width: 240px;
      width: 100%;
    }
  </style>
</head>
<body class="sandbox-page">

  <div class="sandbox-container">

    <!-- Drawing Sandbox Card -->
    <div class="sandbox-grid" style="justify-content: center;">
      <div class="draw-card">
        
        <div class="draw-header">
          <b style="color: #ffffff;">Draw anything you want!</b>
        </div>
        <hr class="draw-divider">

        <!-- Workspace: Canvas on Left, Compact Legend on Right -->
        <div class="draw-workspace">
          
          <!-- Left Side: Canvas & Clear Button -->
          <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <div id="drawb" class="drawbox">
              <canvas id="canvas"></canvas>
            </div>
            <div class="draw-controls" style="width: 100%; display: flex; justify-content: center;">
              <input type="button" id="clear" value="Clear Canvas" class="clear-btn">
            </div>
          </div>

          <!-- Right Side: Concise Legend Box -->
          <div class="legend-box">
            <strong>Controls:</strong><br><br>
            <strong>Colors (0–6):</strong><br>
            <kbd>0</kbd> Black | <kbd>1</kbd> Red | <kbd>2</kbd> Orange<br>
            <kbd>3</kbd> Yellow | <kbd>4</kbd> Green<br>
            <kbd>5</kbd> Blue | <kbd>6</kbd> Violet<br><br>
            <strong>Thickness:</strong><br>
            <kbd>&lt;</kbd> Thin (3px)<br>
            <kbd>&gt;</kbd> Thick (15px)
          </div>

        </div>

      </div>
    </div>

    <!-- Footer Logo Linking Back to Hub -->
    <div class="sandbox-footer">
      <a href="index.html">
        <img class="brand-logo" src="dlogo.png" alt="DMACC Bears Logo">
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="draw.js"></script>
</body>
</html>
