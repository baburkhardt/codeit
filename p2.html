<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMACC IT - Draw Sandbox (P2)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ensures the canvas drawing surface is solid white and scales cleanly */
    #canvas {
      background-color: #FFFFFF !important;
      border-radius: 4px;
      width: 100%;
      max-width: 500px;
      height: auto;
      aspect-ratio: 1 / 1;
    }
  </style>
</head>
<body class="sandbox-page">

  <div class="sandbox-container">

    <!-- Drawing Sandbox Card -->
    <div class="sandbox-grid" style="justify-content: center;">
      <div class="draw-card">
        
        <div class="draw-header">
          <b style="color: #ffffff;">Draw anything you want!</b>
        </div>
        <hr class="draw-divider">
        
        <!-- Canvas Container -->
        <div id="drawb" class="drawbox" style="display: flex; justify-content: center;">
          <canvas id="canvas"></canvas>
        </div>

        <!-- Clear Button Controls -->
        <div class="draw-controls" style="display: flex; justify-content: center; margin-bottom: 15px;">
          <input type="button" id="clear" value="Clear Canvas" class="clear-btn">
        </div>

        <!-- Two-Column Keyboard Controls Legend Box at Bottom -->
        <div style="background-color: #f1f5f9; padding: 14px 18px; border-radius: 8px; font-size: 0.85rem; color: #1e293b; width: 100%; border: 1px solid #cbd5e1; line-height: 1.6; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
          
          <!-- Left Column: Colors -->
          <div style="flex: 1; min-width: 210px;">
            <strong>Colors (Press 0–6):</strong><br>
            <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">0</kbd> Black &nbsp;|&nbsp; <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">1</kbd> Red &nbsp;|&nbsp; <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">2</kbd> Orange<br>
            <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">3</kbd> Yellow &nbsp;|&nbsp; <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">4</kbd> Green<br>
            <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">5</kbd> Blue &nbsp;|&nbsp; <kbd style="background:#e2e8f0; padding:2px 5px; border-radius:4px;">6</kbd> Violet
          </div>

          <!-- Right Column: Line Thickness -->
          <div style="flex: 1; min-width: 150px;">
            <strong>Line Thickness:</strong><br>
            <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">&lt;</kbd> Thin (3px)<br>
            <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">&gt;</kbd> Thick (15px)
          </div>

        </div>

      </div>
    </div>

    <!-- Footer Logo Linking Back to Hub -->
    <div class="sandbox-footer">
      <a href="index.html">
        <img class="brand-logo" src="dlogo.png" alt="DMACC Bears Logo">
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="draw.js"></script>
</body>
</html>
